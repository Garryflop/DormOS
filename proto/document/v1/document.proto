syntax = "proto3";

package document.v1;

option go_package = "github.com/Garryflop/DormOS/gen/proto/document/v1;documentv1";

// ─────────────────────────────────────────────
//  Document Workflow Service
//  Owner: Diasbek
// ─────────────────────────────────────────────

service DocumentService {
  // Student submits a document request — initializes workflow chain
  rpc SubmitRequest(SubmitDocumentRequest) returns (SubmitDocumentResponse);

  // Approver approves the current pending step
  rpc ApproveStep(ApproveStepRequest) returns (ApproveStepResponse);

  // Approver rejects the current pending step — halts workflow
  rpc RejectStep(RejectStepRequest) returns (RejectStepResponse);

  // Get full status of a request including all approval steps
  rpc GetRequestStatus(GetRequestStatusRequest) returns (RequestStatusResponse);
}

// ─── SubmitRequest ──────────────────────────

message SubmitDocumentRequest {
  string student_id     = 1; // From JWT (set by API Gateway)
  string dorm_id        = 2; // From JWT
  string document_type  = 3; // e.g. "residency_confirmation", "checkout_clearance"
  string purpose        = 4; // e.g. "bank account opening"
  map<string, string> metadata = 5; // Extra fields depending on document type
}

message SubmitDocumentResponse {
  string request_id     = 1;
  string status         = 2; // "in_progress"
  int32  total_steps    = 3;
  string submitted_at   = 4; // RFC3339
  string first_approver_role = 5;
}

// ─── ApproveStep ────────────────────────────

message ApproveStepRequest {
  string request_id  = 1;
  string approver_id = 2; // From JWT (set by API Gateway)
  string comment     = 3; // Optional
}

message ApproveStepResponse {
  string request_id    = 1;
  int32  step_approved = 2;
  bool   is_final      = 3;   // True if all steps are done
  string status        = 4;   // "in_progress" or "approved"
  string next_approver_role = 5; // Empty if final
  string next_approver_id   = 6; // Empty if final or role-based
  string decided_at    = 7;
}

// ─── RejectStep ─────────────────────────────

message RejectStepRequest {
  string request_id       = 1;
  string approver_id      = 2; // From JWT
  string rejection_reason = 3;
}

message RejectStepResponse {
  string request_id  = 1;
  int32  step_number = 2;
  string status      = 3; // "rejected"
  string decided_at  = 4;
}

// ─── GetRequestStatus ───────────────────────

message GetRequestStatusRequest {
  string request_id = 1;
  string dorm_id    = 2; // For tenant isolation check
}

message RequestStatusResponse {
  string request_id     = 1;
  string student_id     = 2;
  string document_type  = 3;
  string status         = 4; // "pending" | "in_progress" | "approved" | "rejected" | "cancelled"
  int32  current_step   = 5;
  int32  total_steps    = 6;
  string submitted_at   = 7;
  string completed_at   = 8; // Empty if not completed
  repeated ApprovalStepStatus steps = 9;
}

message ApprovalStepStatus {
  int32  step_number     = 1;
  string approver_role   = 2;
  string approver_id     = 3; // Specific user or empty (any with role)
  string status          = 4; // "pending" | "approved" | "rejected" | "skipped"
  string decided_by      = 5;
  string decision_comment = 6;
  string decided_at      = 7;
  string created_at      = 8;
}
