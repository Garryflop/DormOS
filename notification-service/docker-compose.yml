services:

  postgres:
    image: postgres:16-alpine
    container_name: dormos_notification_pg

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dormos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-notification_db}

    ports:
      - "5435:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dormos -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: dormos_notification_redis

    ports:
      - "6382:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  nats:
    image: nats:2.10-alpine
    container_name: dormos_nats

    ports:
      - "4222:4222"
      - "8222:8222"

    command:
      - "-js"


  migrate:
    image: migrate/migrate:v4.17.0
    container_name: dormos_notification_migrate

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./migrations:/migrations

    command:
      [
        "-path=/migrations",
        "-database=postgres://dormos:secret@postgres:5432/notification_db?sslmode=disable",
        "up"
      ]

    restart: on-failure


  notification-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dormos_notification_service

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      nats:
        condition: service_started

      migrate:
        condition: service_completed_successfully

    environment:
      DATABASE_URL: postgres://dormos:secret@postgres:5432/notification_db?sslmode=disable

      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""

      NATS_URL: nats://nats:4222

      GRPC_PORT: 50054

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

    ports:
      - "50054:50054"

    restart: unless-stopped


volumes:
  pg_data: