version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dormos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dormos123}
      POSTGRES_DB: ${POSTGRES_DB:-dormos}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dormos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"  # Client port
      - "8222:8222"  # HTTP management port
    command: ["-js"] # Enable JetStream if needed

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:

  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "8080:8080"
    environment:
      - API_GATEWAY_PORT=8080
      - ROOM_SERVICE_ADDR=room-service:50052
      - FILE_SERVICE_ADDR=file-service:50053
    depends_on:
      - room-service
      - file-service

  room-service:
    build:
      context: .
      args:
        SERVICE_NAME: room-service
    ports:
      - "50052:50052"
    environment:
      - DATABASE_URL=postgres://dormos:dormos123@postgres:5432/dormos?sslmode=disable
      - REDIS_URL=redis://:redis123@redis:6379/0
      - NATS_URL=nats://nats:4222
      - ROOM_SERVICE_PORT=50052
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  file-service:
    build:
      context: .
      args:
        SERVICE_NAME: file-service
    ports:
      - "50053:50053"
    environment:
      - DATABASE_URL=postgres://dormos:dormos123@postgres:5432/dormos?sslmode=disable
      - REDIS_URL=redis://:redis123@redis:6379/0
      - FILE_SERVICE_PORT=50053
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET=dormos-files
      - MINIO_USE_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
