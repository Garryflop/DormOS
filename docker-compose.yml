services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dormos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dormos123}
      POSTGRES_DB: ${POSTGRES_DB:-dormos}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dormos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js"]

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  issue-service:
    build:
      context: .
      dockerfile: issue-service/Dockerfile
    environment:
      DATABASE_URL: postgres://dormos:dormos123@postgres:5432/dormos?sslmode=disable
      REDIS_URL: redis://:redis123@redis:6379/0
      NATS_URL: nats://nats:4222
      ISSUE_SERVICE_PORT: "50052"
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  room-service:
    build:
      context: .
      args:
        SERVICE_NAME: room-service
    ports:
      - "50054:50054"
    environment:
      - DATABASE_URL=postgres://dormos:dormos123@postgres:5432/dormos?sslmode=disable
      - REDIS_URL=redis://:redis123@redis:6379/0
      - NATS_URL=nats://nats:4222
      - ROOM_SERVICE_PORT=50054
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  file-service:
    build:
      context: .
      args:
        SERVICE_NAME: file-service
    ports:
      - "50053:50053"
    environment:
      - DATABASE_URL=postgres://dormos:dormos123@postgres:5432/dormos?sslmode=disable
      - REDIS_URL=redis://:redis123@redis:6379/0
      - FILE_SERVICE_PORT=50053
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET=dormos-files
      - MINIO_USE_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    ports:
      - "50051:50051"
    environment:
      - DATABASE_URL=postgres://dormos:dormos123@postgres:5432/dormos?sslmode=disable
      - REDIS_URL=redis://:redis123@redis:6379/0
      - GRPC_PORT=50051
      - JWT_SECRET=super_secret_jwt_key_change_in_production
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        SERVICE_NAME: notification-service
    ports:
      - "50055:50055"
    environment:
      - DATABASE_URL=postgres://dormos:dormos123@postgres:5432/dormos?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=redis123
      - NATS_URL=nats://nats:4222
      - GRPC_PORT=50055
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=dummy
      - SMTP_PASSWORD=dummy
      - SMTP_FROM=dummy@dormos.local
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "8080:8080"
    environment:
      - API_GATEWAY_PORT=8080
      - ROOM_SERVICE_ADDR=room-service:50054
      - FILE_SERVICE_ADDR=file-service:50053
      - ISSUE_SERVICE_ADDR=issue-service:50052
      - AUTH_SERVICE_ADDR=auth-service:50051
      - NOTIFICATION_SERVICE_ADDR=notification-service:50055
    depends_on:
      - room-service
      - file-service
      - issue-service
      - auth-service
      - notification-service

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v2.48.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - otel-collector

  tempo:
    image: grafana/tempo:2.3.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:10.2.3
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data: